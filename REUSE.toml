version                      = 1
SPDX-PackageName             = "drac"
SPDX-PackageSupplier         = "Yifei Sun"
SPDX-PackageDownloadLocation = "https://github.com/stepbrobd/drac"

# Generated by Cargo and Nix, which rewrite an inline header away
[[annotations]]
path                    = ["Cargo.lock", "flake.lock"]
precedence              = "aggregate"
SPDX-FileCopyrightText  = "2026 Yifei Sun"
SPDX-License-Identifier = "Apache-2.0"

# The license text itself, carried verbatim
[[annotations]]
path                    = "license.txt"
precedence              = "aggregate"
SPDX-FileCopyrightText  = "NONE"
SPDX-License-Identifier = "Apache-2.0"

# Seeded from the root lock, which Cargo rewrites without a header
[[annotations]]
path                    = "fuzz/Cargo.lock"
precedence              = "aggregate"
SPDX-FileCopyrightText  = "2026 Yifei Sun"
SPDX-License-Identifier = "Apache-2.0"
