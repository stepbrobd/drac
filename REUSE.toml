# SPDX-FileCopyrightText: 2026 Yifei Sun
# SPDX-License-Identifier: Apache-2.0

version                      = 1
SPDX-PackageName             = "drac"
SPDX-PackageSupplier         = "Yifei Sun"
SPDX-PackageDownloadLocation = "https://github.com/stepbrobd/drac"

# Generated by Cargo and Nix, inline header would be rewritten away.
[[annotations]]
path                    = ["Cargo.lock", "flake.lock"]
precedence              = "aggregate"
SPDX-FileCopyrightText  = "2026 Yifei Sun"
SPDX-License-Identifier = "Apache-2.0"

# The license text itself, carried verbatim.
[[annotations]]
path                    = "license.txt"
precedence              = "aggregate"
SPDX-FileCopyrightText  = "NONE"
SPDX-License-Identifier = "Apache-2.0"
